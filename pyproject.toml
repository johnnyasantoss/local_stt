[project]
name = "local-sst"
version = "0.1.0"
description = "Offline speech-to-text pipeline with speaker diarization"
license = "Unlicense OR MIT"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: The Unlicense",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydub",
    "python-dotenv",
    "groq",
    "pyannote-audio",
]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]