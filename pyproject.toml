[project]
name = "groq-stt"
version = "0.1.0"
description = "Audio preprocessing pipeline for Groq Speech-to-Text"
requires-python = ">=3.11"
dependencies = [
    "pydub",
    "python-dotenv",
    "onnx-asr[cpu,hub]",
    "pyannote-audio",
]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]