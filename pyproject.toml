[project]
name = "local-stt"
version = "0.1.0"
description = "Offline speech-to-text pipeline with speaker diarization"
requires-python = ">=3.11"
license = "Unlicense OR MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: The Unlicense",
]
dependencies = [
  "groq",
  "pyannote-audio",
  "pydub",
  "python-dotenv",
]

[dependency-groups]
dev = [
  "ruff>=0.15.20",
  "tombi>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# pyright configuration: suppress known false-positives from dynamic dispatch patterns.
[tool.uv.pip]
extra-index-url = ["https://pypi.org/simple/"]

# The following settings are consumed by uv check --preview-features check-command (pyright).

